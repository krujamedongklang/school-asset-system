name: Keep Render Server Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance spin down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping School Asset Server
        run: |
          curl -s -f "https://school-asset-system.onrender.com/api/health" || echo "Ping failed or server sleeping"
